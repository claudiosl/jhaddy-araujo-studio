<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página Não Encontrada | Jhaddy Araújo Studio</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/logo-icon.png?v=2.0">
  <meta name="theme-color" content="#140E0C">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-wrapper {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at center, rgba(194, 159, 104, 0.12) 0%, transparent 70%), var(--color-bg);
    }
    .error-box {
      max-width: 580px;
      margin: 0 auto;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 12vw, 8.5rem);
      font-weight: 700;
      color: var(--color-gold);
      line-height: 1;
      margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--color-text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-cta-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="nav-island-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-monogram">✦</span>
        <div>
          <span class="brand-name" data-config="shortName">Jhaddy Araújo Studio</span>
          <span class="brand-tag">Estética & Bem-Estar</span>
        </div>
      </a>
      <a href="index.html" class="btn-secondary" style="padding: 0.5rem 1.25rem; font-size: 0.85rem;">
        Ir para o Início
      </a>
    </div>
  </header>

  <main class="error-wrapper">
    <div class="error-box">
      <div class="eyebrow-badge">
        <span class="eyebrow-dot"></span>
        <span>Erro 404</span>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Página Não Encontrada</h1>
      <p class="error-desc">
        O endereço acessado não existe ou foi alterado. Utilize os botões abaixo para voltar à página inicial ou falar diretamente com o estúdio pelo WhatsApp.
      </p>

      <div class="error-cta-group">
        <a href="index.html" class="btn-primary">
          <span>Retornar para a Página Inicial</span>
          <span class="btn-trailing-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </span>
        </a>

        <a href="https://wa.me/5571987870244?text=Ol%C3%A1%2C%20Jhaddy!%20Estava%20no%20site%20e%20gostaria%20de%20informa%C3%A7%C3%B5es." class="btn-whatsapp" target="_blank" rel="noopener noreferrer">
          <span>Falar no WhatsApp</span>
          <span class="btn-trailing-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </span>
        </a>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
